services:
  frontend:
    image: matias000001/example-frontend
    ports:
      - "5001:5001"

  backend:
    image: matias000001/example-backend
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: db
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./database:/var/lib/postgresql
